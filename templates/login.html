<!DOCTYPE html>
<html>
<head>
    <title>Login - HireMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<form method="post">
    <h2>Login</h2>
    <input type="email" name="email" placeholder="Email" required><br><br>

    <p>No account? <a href="/register">Register</a></p>
</form>

</body>
</html>

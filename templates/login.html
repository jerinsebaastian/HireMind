<!DOCTYPE html>
<html>
<head>
    <title>Login - HireMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 80px auto;
            background: white;
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.6s ease-out;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .auth-logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #2C7BE5 0%, #1a5fd0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-title {
            font-size: 24px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            color: #64748b;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #2C7BE5;
            box-shadow: 0 0 0 3px rgba(44, 123, 229, 0.1);
        }
        
        .form-input::placeholder {
            color: #94a3b8;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 15px;
        }
        
        .auth-footer a {
            color: #2C7BE5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .auth-footer a:hover {
            color: #1a5fd0;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="auth-logo">
            <svg width="48" height="48" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" fill="#2C7BE5" opacity="0.1"/>
                <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="#2C7BE5"/>
                <circle cx="20" cy="20" r="4" fill="white"/>
            </svg>
            <h1>HireMind</h1>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue your skill development journey</p>
    </div>

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input 
                type="email" 
                id="email"
                name="email" 
                class="form-input"
                placeholder="Enter your email" 
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input 
                type="password" 
                id="password"
                name="password" 
                class="form-input"
                placeholder="Enter your password" 
                required
            >
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            Sign In
        </button>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Create one now</a>
        </div>
    </form>
</div>

</body>
</html>

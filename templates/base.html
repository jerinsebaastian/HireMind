<!DOCTYPE html>
<html lang="en">
<head>
    <title>HireMind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .top-nav {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            padding: 0 40px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 16px rgba(15,23,42,0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-welcome {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            font-weight: 500;
            padding-right: 12px;
            border-right: 1px solid rgba(255,255,255,0.2);
            margin-right: 4px;
        }

        .nav-link {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-link:hover { background: rgba(255,255,255,0.15); color: white; }
        .nav-link.logout {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .nav-link.logout:hover { background: rgba(255,59,48,0.3); border-color: rgba(255,59,48,0.5); }

        .page-content {
            min-height: calc(100vh - 64px);
            background: linear-gradient(160deg, #eff6ff 0%, #e0eaff 50%, #f0f4ff 100%);
            padding: 32px 24px;
        }
    </style>
</head>
<body>

{% if session.get('username') %}
<nav class="top-nav">
    <a href="/dashboard" class="nav-brand">
        <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" fill="white" opacity="0.2"/>
            <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="white"/>
            <circle cx="20" cy="20" r="4" fill="#2563eb"/>
        </svg>
        HireMind
    </a>
    <div class="nav-links">
        <span class="nav-welcome">{{ session['username'] }}</span>
        <a href="/dashboard" class="nav-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
            Dashboard
        </a>
        <a href="/logout" class="nav-link logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            Logout
        </a>
    </div>
</nav>
{% endif %}

<div class="page-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>

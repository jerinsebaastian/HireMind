<!DOCTYPE html>
<html>
<head>
    <title>HireMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        .top-nav {
            background: linear-gradient(135deg, #2C7BE5 0%, #1a5fd0 100%);
            padding: 16px 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        
        .nav-welcome {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .nav-divider {
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }
        
        .page-content {
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: calc(100vh - 64px);
        }
    </style>
</head>
<body>

{% if session.get('username') %}
<div class="top-nav">
    <div class="nav-brand">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" fill="white" opacity="0.2"/>
            <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="white"/>
            <circle cx="20" cy="20" r="4" fill="#2C7BE5"/>
        </svg>
        HireMind
    </div>
    
    <div class="nav-links">
        <span class="nav-welcome">Welcome, {{ session['username'] }}!</span>
        <span class="nav-divider">|</span>
        <a href="/dashboard" class="nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
            Dashboard
        </a>
        <span class="nav-divider">|</span>
        <a href="/logout" class="nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            Logout
        </a>
    </div>
</div>
{% endif %}

<div class="page-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>

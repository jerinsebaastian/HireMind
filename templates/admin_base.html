<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel – HireMind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
        }

        .admin-shell { display: flex; min-height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 240px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 26px 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand-name {
            font-size: 18px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.4px;
        }
        .admin-chip {
            font-size: 10px;
            font-weight: 700;
            background: #2563eb;
            color: white;
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.07);
            color: white;
        }
        .sidebar-nav a.active {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: white;
            box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        }
        .sidebar-nav a svg { flex-shrink: 0; }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .sidebar-footer a:hover {
            background: rgba(239,68,68,0.1);
            color: #fca5a5;
        }

        /* ── Main content ── */
        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .admin-topbar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 32px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
        }

        .topbar-right {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: #64748b; font-weight: 500;
        }
        .admin-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800;
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        /* ── Headings ── */
        .content-area h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
        }
        .content-area h3 {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            margin-top: 28px;
        }

        /* ── Cards ── */
        .card {
            background: white;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            padding: 22px 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.04);
        }

        /* ── Table ── */
        .modern-table { width: 100%; border-collapse: collapse; }
        .modern-table thead th {
            background: #f8fafc; padding: 12px 16px;
            text-align: left; font-size: 11px; font-weight: 700;
            color: #475569; text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
        }
        .modern-table tbody td {
            padding: 14px 16px; border-bottom: 1px solid #f1f5f9;
            font-size: 14px; color: #0f172a; vertical-align: middle;
        }
        .modern-table tbody tr:last-child td { border-bottom: none; }
        .modern-table tbody tr:hover td { background: #f8fafc; }

        /* ── Buttons ── */
        .btn-primary {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }

        button {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 18px;
            background: white; border: 1.5px solid #e2e8f0;
            color: #374151; border-radius: 8px;
            font-size: 13px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.2s;
        }
        button:hover { border-color: #93c5fd; color: #2563eb; background: #eff6ff; }

        /* ── Results summary for admin dashboard ── */
        .results-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .results-summary .card {
            display: flex; flex-direction: column; gap: 4px;
            font-size: 14px; color: #475569; font-weight: 600;
        }
        .results-summary .card strong {
            font-size: 28px; font-weight: 800; color: #0f172a;
        }

        /* ── Skill pills ── */
        .skill-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: #eff6ff; padding: 4px 10px; border-radius: 20px;
            margin: 3px; font-size: 12px; border: 1px solid #93c5fd; color: #1e40af;
        }
        .skill-weight {
            background: #2563eb; color: white;
            padding: 1px 7px; border-radius: 10px;
            font-weight: 700; font-size: 11px;
        }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.6);
            justify-content: center; align-items: center; z-index: 10000;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: white; padding: 36px; border-radius: 18px;
            max-width: 600px; width: 90%; max-height: 85vh;
            overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: popIn 0.25s ease;
        }
        @keyframes popIn {
            from { opacity:0; transform: scale(0.95) translateY(16px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .modal-box h3 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 20px; }
        .skill-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .skill-row input { flex: 1; }
        .skill-row button {
            background: #fee2e2; color: #991b1b; border: none;
            padding: 8px 12px; border-radius: 6px; cursor: pointer;
        }
        .skill-row button:hover { background: #fecaca; }

        /* ── Scroll to top ── */
        #topBtn {
            display: none; position: fixed; bottom: 24px; right: 24px; z-index: 99;
            border: none; background: linear-gradient(135deg,#2563eb,#1d4ed8);
            color: white; cursor: pointer; width: 44px; height: 44px;
            border-radius: 50%; font-size: 18px;
            box-shadow: 0 4px 16px rgba(37,99,235,0.4);
            transition: all 0.2s; font-family: inherit;
            display: none; align-items: center; justify-content: center;
        }
        #topBtn:hover { transform: translateY(-3px); }

        /* ── Forms ── */
        form input[type="text"],
        form input[type="email"],
        form input[type="number"],
        form select {
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.2s;
            outline: none;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        form input:focus, form select:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        /* ── Pagination ── */
        .pagination, [style*="margin-top:20px"] {
            display: flex; align-items: center; gap: 6px;
            margin-top: 24px; flex-wrap: wrap;
        }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ── Analytics grid ── */
        .analytics-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: white; border-radius: 14px;
            border: 1.5px solid #e2e8f0; padding: 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.04);
        }
        .chart-card h3 { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 20px; }
        .chart-card canvas { max-height: 280px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .analytics-container { grid-template-columns: 1fr; }
            .content-area { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="admin-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" fill="white" opacity="0.15"/>
                <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="white"/>
                <circle cx="20" cy="20" r="4" fill="#2563eb"/>
            </svg>
            <div>
                <div class="sidebar-brand-name">HireMind</div>
            </div>
            <span class="admin-chip">ADMIN</span>
        </div>

        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="{% if request.path == '/admin/dashboard' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                Dashboard
            </a>
            <a href="/admin/assessments" class="{% if request.path == '/admin/assessments' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/></svg>
                Assessments
            </a>
            <a href="/admin/job_roles" class="{% if request.path == '/admin/job_roles' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/></svg>
                Job Roles
            </a>
            <a href="/admin/analytics" class="{% if request.path == '/admin/analytics' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                Analytics
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/logout">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main -->
    <div class="admin-main">
        <div class="admin-topbar">
            <span class="topbar-title">Admin Panel</span>
            <div class="topbar-right">
                <span>admin@hiremind.com</span>
                <div class="admin-avatar">A</div>
            </div>
        </div>

        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

</body>
</html>

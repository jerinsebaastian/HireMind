{% extends "admin_base.html" %}
{% block content %}

<h2 style="margin-bottom: 20px;">Analytics</h2>

<div class="analytics-container">

```
<!-- Chart 1 -->
<div class="chart-card">
    <h3>User Readiness Distribution</h3>
    <canvas id="chart1"></canvas>
</div>

<!-- Chart 2 -->
<div class="chart-card">
    <h3>Assessments by Job Role</h3>
    <canvas id="chart2"></canvas>
</div>
```

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// Data
const readinessLabels = {{ readiness | map(attribute=0) | list | tojson }};
const readinessCounts = {{ readiness | map(attribute=1) | list | tojson }};

const roleLabels = {{ roles | map(attribute=0) | list | tojson }};
const roleCounts = {{ roles | map(attribute=1) | list | tojson }};

// Pie Chart
new Chart(document.getElementById('chart1'), {
    type: 'pie',
    data: {
        labels: readinessLabels,
        datasets: [{
            label: 'Readiness',
            data: readinessCounts,
            backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
        }]
    },
    options: {
        plugins: {
            legend: {
                position: 'bottom'
            }
        }
    }
});

// Bar Chart
new Chart(document.getElementById('chart2'), {
    type: 'bar',
    data: {
        labels: roleLabels,
        datasets: [{
            label: 'Assessments',
            data: roleCounts,
            backgroundColor: '#2C7BE5'
        }]
    },
    options: {
        scales: {
            y: {
                beginAtZero: true
            }
        },
        plugins: {
            legend: {
                display: false
            }
        }
    }
});
</script>

{% endblock %}

{% extends "base.html" %}
{% block content %}
<head>
    <title>Select Job Role - HireMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<div class="container">
    <div class="header">
        <div class="logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" fill="#2C7BE5" opacity="0.1"/>
                <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="#2C7BE5"/>
                <circle cx="20" cy="20" r="4" fill="white"/>
            </svg>
            <h1>HireMind</h1>
        </div>
        <div class="step-indicator">
            <div class="step active">1</div>
            <div class="step-line"></div>
            <div class="step">2</div>
            <div class="step-line"></div>
            <div class="step">3</div>
        </div>
    </div>

    <div class="content-header">
        <h2>Select Your Target Job Role</h2>
        <p class="subtitle">Choose the role that aligns with your career goals. We'll assess your readiness for this position.</p>
    </div>

    <form action="/skills" method="post">
        <div class="job-roles-grid">
            {% for role, icon in roles %}

            <div class="job-role-card">

                <input 
                    type="radio" 
                    name="job_role" 
                    id="role_{{ loop.index }}" 
                    value="{{ role }}" 
                    required
                >

                <label for="role_{{ loop.index }}">
                    <div class="icon">{{ icon }}</div>
                    <div class="role-name">{{ role }}</div>
                </label>

            </div>

            {% endfor %}
        </div>

        <div class="button-container">
            <button type="submit" class="btn-primary">
                Continue to Skills Assessment
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 4L8.59 5.41L13.17 10L8.59 14.59L10 16L16 10L10 4Z"/>
                </svg>
            </button>
        </div>
    </form>
</div>

{% endblock %}

{% extends "base.html" %}
{% block content %}
<head>
    <title>Select Role – HireMind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, .page-content { font-family: 'Plus Jakarta Sans', sans-serif; }

        .page-wrapper {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Progress stepper */
        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 40px;
        }
        .stepper-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .stepper-circle {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s;
        }
        .stepper-circle.active { background: #2563eb; color: white; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        .stepper-circle.inactive { background: rgba(255,255,255,0.6); color: #94a3b8; border: 2px solid #cbd5e1; }
        .stepper-label { font-size: 12px; font-weight: 600; color: #64748b; white-space: nowrap; }
        .stepper-label.active-label { color: #2563eb; }

        .stepper-line {
            width: 80px; height: 2px;
            background: #cbd5e1;
            margin: 0 4px;
            margin-bottom: 22px;
        }

        /* Header */
        .page-head {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-head h1 {
            font-size: 36px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }
        .page-head p { font-size: 16px; color: #475569; max-width: 500px; margin: 0 auto; line-height: 1.6; }

        /* Roles grid */
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .role-card { position: relative; }
        .role-card input[type="radio"] {
            position: absolute; opacity: 0; pointer-events: none;
        }
        .role-card label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 28px 20px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            height: 100%;
            min-height: 130px;
        }
        .role-card label:hover {
            border-color: #93c5fd;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(37,99,235,0.12);
        }
        .role-card input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-color: #2563eb;
            box-shadow: 0 8px 24px rgba(37,99,235,0.2);
        }
        .role-icon { font-size: 42px; line-height: 1; }
        .role-name {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
        }

        /* CTA */
        .cta-row {
            display: flex;
            justify-content: center;
        }
        .btn-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 36px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.2px;
        }
        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(37,99,235,0.4);
        }
    </style>
</head>

<div class="page-wrapper">
    <!-- Stepper -->
    <div class="stepper">
        <div class="stepper-step">
            <div class="stepper-circle active">1</div>
            <span class="stepper-label active-label">Select Role</span>
        </div>
        <div class="stepper-line"></div>
        <div class="stepper-step">
            <div class="stepper-circle inactive">2</div>
            <span class="stepper-label">Rate Skills</span>
        </div>
        <div class="stepper-line"></div>
        <div class="stepper-step">
            <div class="stepper-circle inactive">3</div>
            <span class="stepper-label">View Results</span>
        </div>
    </div>

    <!-- Heading -->
    <div class="page-head">
        <h1>What's your target role?</h1>
        <p>Choose the job role you're aiming for. We'll match your skills against real industry requirements.</p>
    </div>

    <!-- Form -->
    <form action="/skills" method="post">
        <div class="roles-grid">
            {% for role, icon in roles %}
            <div class="role-card">
                <input type="radio" name="job_role" id="role_{{ loop.index }}" value="{{ role }}" required>
                <label for="role_{{ loop.index }}">
                    <div class="role-icon">{{ icon }}</div>
                    <div class="role-name">{{ role }}</div>
                </label>
            </div>
            {% endfor %}
        </div>

        <div class="cta-row">
            <button type="submit" class="btn-cta">
                Continue to Skills Assessment
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
            </button>
        </div>
    </form>
</div>

{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Register - HireMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 80px auto;
            background: white;
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.6s ease-out;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .auth-logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #2C7BE5 0%, #1a5fd0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-title {
            font-size: 24px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            color: #64748b;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #2C7BE5;
            box-shadow: 0 0 0 3px rgba(44, 123, 229, 0.1);
        }
        
        .form-input::placeholder {
            color: #94a3b8;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 15px;
        }
        
        .auth-footer a {
            color: #2C7BE5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .auth-footer a:hover {
            color: #1a5fd0;
        }
        
        .password-hint {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="auth-logo">
            <svg width="48" height="48" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" fill="#2C7BE5" opacity="0.1"/>
                <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="#2C7BE5"/>
                <circle cx="20" cy="20" r="4" fill="white"/>
            </svg>
            <h1>HireMind</h1>
        </div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Start your journey to career readiness</p>
    </div>

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input 
                type="text" 
                id="name"
                name="name" 
                class="form-input"
                placeholder="Enter your full name" 
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input 
                type="email" 
                id="email"
                name="email" 
                class="form-input"
                placeholder="Enter your email" 
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input 
                type="password" 
                id="password"
                name="password" 
                class="form-input"
                placeholder="Create a strong password" 
                required
            >
            <p class="password-hint">Use at least 8 characters with letters and numbers</p>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input 
                type="password" 
                id="confirm_password"
                name="confirm_password" 
                class="form-input"
                placeholder="Re-enter your password" 
                required
            >
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Create Account
        </button>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in instead</a>
        </div>
    </form>
</div>

</body>
</html>
